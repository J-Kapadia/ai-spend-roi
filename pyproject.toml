[project]
name = "ai-spend-roi"
version = "0.0.0"
description = "Ties a company's AI spend, by team, to what each team produces, on synthetic data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click",
    "dbt-core",
    "dbt-duckdb",
    "duckdb",
    "jinja2",
    "numpy",
    "pyyaml",
    "scipy",
]

[project.scripts]
roi = "roi.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (coverage simulation, perf smoke, kill tests, concurrent builds); run by the default tier of the definition of done only",
]
