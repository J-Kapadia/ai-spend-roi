# The warehouse file is passed by `roi build` as --vars '{db_path: ...}'.
roi:
  target: default
  outputs:
    default:
      type: duckdb
      path: "{{ var('db_path') }}"
      threads: 1
      # The same memory cap as every connection `roi` opens (default 2GB): DuckDB would
      # otherwise take 80% of the machine's memory for this one run.
      settings:
        memory_limit: "{{ env_var('ROI_DUCKDB_MEMORY_LIMIT', '2GB') }}"
