# Value per unit of each team's output, and the settings of the ROI, allocation and agenda steps.
#
# `roi build` reads this file. Every measured team listed under `value_per_unit` needs a value
# per unit (USD) as low <= base <= high; while a measured team's values are empty the build exits
# 4 and asks for them. A value per unit is an assumption, not a finding: the memo prints it with
# its range.
#
# kind (optional; when given it must equal the team's `kind` in the books):
#   additive    dollars = unit lift x headcount-months x value; the lift is per head per month
#               and the value is USD per unit of output
#   team_level  dollars = unit lift x months x value; the metric is a level for the whole team
#               and the value is USD per unit-month of change (days to close)
#
# A measured team that is not listed here (a toy company, say) gets no ROI row.

value_per_unit:
  # Base = half the avoided labour cost of one unit: loaded monthly payroll per head / baseline
  # output per head per month (config/gen.yaml) / 2, to three significant figures. Low = half the
  # base; high = double the base. For finance_operations the base is half of one calendar day of
  # the team's loaded payroll: 14 heads x 10,180 USD x 12 / 365 / 2.
  platform_engineering: {kind: additive, low: 1290, base: 2580, high: 5160}    # per change shipped: 16,543 / 3.2 / 2
  support: {kind: additive, low: 6.5, base: 13, high: 26}                      # per ticket resolved: 7,526 / 290 / 2
  sales_development: {kind: additive, low: 0.00615, base: 0.0123, high: 0.0246} # per USD of pipeline created: 7,746 / 315,000 / 2
  product_engineering: {kind: additive, low: 1120, base: 2240, high: 4480}     # per change shipped: 16,543 / 3.7 / 2
  marketing: {kind: additive, low: 239.5, base: 479, high: 958}                # per asset shipped: 9,582 / 10 / 2
  finance_operations: {kind: team_level, low: 1170, base: 2340, high: 4680}    # per day of close time, per month
  legal_operations: {kind: additive, low: 70, base: 140, high: 280}            # per contract reviewed: 11,183 / 40 / 2
  people_operations: {kind: additive, low: 2885, base: 5770, high: 11540}      # per requisition filled: 9,238 / 0.8 / 2

sensitivity:
  multipliers: [0.5, 0.75, 1.0, 1.25, 1.5]   # global scale of the base value, for the grid
  survive_share: 0.90                        # a team survives when its ROI multiple exceeds 1 in this share
                                             # of the 1,000 draws of its value (the draws are fixed in code)

memo_budget_usd: 18000  # monthly increment the allocation spreads, whole USD: 40% of the summed headroom
                        # sum(headcount x (1.5 x target - target)) over the five teams measured through 2026-03
                        # = 0.4 x 46,175 = 18,470, rounded to the nearest 1,000
rho: 0.05               # within-user correlation for the testing agenda; a config assumption
sigma_override: {}      # optional {team_id: sigma} for the testing agenda, printed as a config assumption
