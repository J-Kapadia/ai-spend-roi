name: pages

# Manual only, until the real company's configuration is committed.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked dependencies
        run: uv sync --frozen
      - name: Build the site and check that every number resolves
        run: |
          uv run --frozen roi build --toy --work-dir "$RUNNER_TEMP/work"
          uv run --frozen roi memo --month 2025-06 --check --work-dir "$RUNNER_TEMP/work"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/work/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
