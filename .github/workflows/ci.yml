name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked dependencies
        run: uv sync --frozen
      # Run without a network where the runner allows it, so a hidden network call fails loudly.
      - name: Product tests
        run: |
          run="$(unshare -n true 2>/dev/null && echo 'unshare -n' || true)"
          $run uv run --frozen pytest -q -m "not slow"
      - name: Build the synthetic company and check that every number resolves
        run: |
          run="$(unshare -n true 2>/dev/null && echo 'unshare -n' || true)"
          work="$(mktemp -d)"
          $run uv run --frozen roi gen --work-dir "$work"
          $run uv run --frozen roi build --work-dir "$work"
          $run uv run --frozen roi memo --month 2026-03 --check --work-dir "$work"
          $run uv run --frozen roi doctor --tree --work-dir "$work"

  definition-of-done:
    # The default tier of the definition of done, as the clean-extraction gate runs it.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked dependencies
        run: uv sync --frozen
      - name: Definition of done
        run: scripts/definition-of-done.sh
